# PROPOSED release workflow (#26). It is inert here: it runs only after a maintainer copies it to
# .github/workflows/ in a reviewed PR, configures the PyPI trusted publisher and the protected pypi
# environment, and re-checks every action pin. See docs/releasing.md.
name: Release to PyPI
on:
  release:
    types:
      - published
permissions:
  contents: read
concurrency:
  group: release-pypi
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check the tag and the dated CHANGELOG name one version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 -I tools/release_check.py --release --tag "$RELEASE_TAG"
      - name: Run the test suite
        run: python -m unittest discover -v
      - name: Install the pinned build frontend
        run: python -m pip install build==1.6.1
      - name: Build the sdist and wheel once
        run: python -m build --sdist --wheel --outdir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/agent-contrib/
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
